# -----------------------------------------------------
# Input Devices
# -----------------------------------------------------
# Documentation: https://docs.noctalia.dev/umbriel/configuration/input/

[input.keyboard]
layout = "de"
repeat_rate = 25
repeat_delay = 600
numlock_toggle = false

[input.focus]
follows_mouse = true
hover_raises = false

[input.mouse]
natural_scroll = false

[input.touchpad]
natural_scroll = true
disable_while_typing = true
tap = true
tap_and_drag = true
drag_lock = "sticky"

